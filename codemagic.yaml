workflows:
  ios-app-store:
    name: Lensly iOS App Store
    max_build_duration: 60
    environment:
      node: 22.11.0
      xcode: 16.2
      vars:
        BUNDLE_ID: "com.lensly.app"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        VITE_BASE44_APP_ID: "699b110a371758e340a213c3"
        VITE_BASE44_APP_BASE_URL: "https://getlenslyapp.com"
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Install Capacitor packages
        script: npm install @capacitor/core @capacitor/cli @capacitor/ios
      - name: Build web assets
        script: npm run build
      - name: Add iOS platform if not present
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          else
            echo "iOS folder already exists, skipping cap add ios"
          fi
      - name: Sync Capacitor
        script: npx cap sync ios
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Set build number
        script: |
          LATEST=$(app-store-connect get-latest-app-store-build-number "$BUNDLE_ID" --platform=IOS 2>/dev/null || echo "0")
          agvtool new-version -all $((LATEST + 1))
        working_directory: ios/App
      - name: Build iOS
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
