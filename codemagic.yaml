workflows:
  ios-workflow:
    name: iOS Workflow
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.base699b110a371758e340a213c3.app
      app_store_connect:                  # ← Codemagic handles all signing automatically
        api_key: Env_AppStoreConnect      # ← Name of the key you added in Codemagic
      vars:
        BUNDLE_ID: "com.base699b110a371758e340a213c3.app"
    scripts:
      - name: Install dependencies
        script: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/ios

      - name: Build web assets
        script: |
          npm run build

      - name: Add iOS platform if not present
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      - name: Sync Capacitor
        script: |
          npx cap sync ios

      - name: Set up code signing  # ← THIS WAS MISSING — applies your provisioning profile
        script: |
          xcode-project use-profiles

      - name: Archive iOS app
        script: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$CM_BUILD_DIR/App.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=YES

      - name: Export IPA  # ← THIS WAS MISSING — converts archive to .ipa
        script: |
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
