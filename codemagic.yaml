workflows:
  ios-workflow:
    name: iOS Workflow

    environment:
      vars:
        BUNDLE_ID: "com.lensly.app"

    scripts:
      - name: Install dependencies
        script: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/ios

      - name: Build web assets
        script: |
          npm run build

      - name: Add iOS platform if not present
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      - name: Sync Capacitor
        script: |
          npx cap sync ios

      - name: Build iOS app
        script: |
          cd ios/App
          ls

          xcodebuild -project App.xcodeproj \
          -scheme App \
          -sdk iphoneos \
          -configuration Release
artifacts:
  - ios/build/**/*.ipa
