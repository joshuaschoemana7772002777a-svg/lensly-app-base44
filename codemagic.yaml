workflows:
  ios-app-store:
    name: Lensly iOS App Store
    max_build_duration: 60
    environment:
      node: 18.17.0
      xcode: 16.2
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.lensly.app
      vars:
        BUNDLE_ID: "com.lensly.app"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      app_store_connect:
        api_key: $APP_STORE_CONNECT_API_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Install Capacitor packages
        script: npm install @capacitor/core @capacitor/cli @capacitor/ios
      - name: Build web assets
        script: npm run build
      - name: Add iOS platform if not present
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          else
            echo "iOS folder already exists, skipping cap add ios"
          fi
      - name: Sync Capacitor
        script: npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install
      - name: Set build number
        script: |
          LATEST=$(app-store-connect get-latest-app-store-build-number "$BUNDLE_ID" --platform=IOS 2>/dev/null || echo "0")
          agvtool new-version -all $((LATEST + 1))
        working_directory: ios/App
      - name: Build iOS
        script: |
          xcode-project use-profiles
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: environment_variable
        submit_to_testflight: true
        submit_to_app_store: false
